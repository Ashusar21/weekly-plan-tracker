name: Backend CD

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/WeeklyPlanTracker.sln

      - name: Publish
        run: dotnet publish backend/WeeklyPlanTracker.Api/WeeklyPlanTracker.Api.csproj -c Release -o ./publish

      - name: Zip publish output
        run: cd publish && zip -r ../publish.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name wpt-api-ashusar \
            --resource-group weekly-plan-tracker-rg \
            --src-path publish.zip \
            --type zip
