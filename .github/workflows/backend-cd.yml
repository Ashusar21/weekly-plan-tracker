name: Backend CD

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/WeeklyPlanTracker.sln

      - name: Build
        run: dotnet build backend/WeeklyPlanTracker.sln -c Release

      - name: Test
        run: dotnet test backend/WeeklyPlanTracker.sln
