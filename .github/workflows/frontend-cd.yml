name: Frontend CD

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/weekly-plan-tracker-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/weekly-plan-tracker-web

      - name: Build
        run: npm run build -- --configuration production
        working-directory: frontend/weekly-plan-tracker-web

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/weekly-plan-tracker-web
          output_location: dist/weekly-plan-tracker-web/browser
